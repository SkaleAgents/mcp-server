name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Owner can require approval here. The npm trusted publisher must name this environment.
    environment: npm-publish
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC token for a short-lived publish credential.
      id-token: write
    steps:
      # Full history so the tag commit can be checked against main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Only publish commits on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 bundles an older npm.
      - name: Upgrade npm
        run: npm install -g npm@11.5.2

      # Lifecycle scripts stay off so a compromised transitive dependency cannot run with the OIDC token present.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Publish
        run: npm publish --provenance --access public
