name: Publish to MCP registry

# Run by hand after an npm release. GitHub OIDC proves the SkaleAgents org namespace (io.github.SkaleAgents/*).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install mcp-publisher v1.8.1
        run: |
          curl -sSfL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate
        run: ./mcp-publisher validate

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
