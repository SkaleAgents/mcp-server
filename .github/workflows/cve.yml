name: CVE scan

on:
  workflow_dispatch:
  # The PR Action cannot see a CVE published after merge, so check the lockfile daily.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  cves:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installed outside the checkout: npx here would resolve this repo's own, unbuilt package.
      # Sends package names and versions, not source, to api.osv.dev.
      - name: Check lockfile for known CVEs
        run: |
          tool="$RUNNER_TEMP/skaleagents-tool"
          mkdir -p "$tool"
          (cd "$tool" && npm install --no-save --no-package-lock --ignore-scripts --registry=https://registry.npmjs.org @skaleagents/swarm@0.12.0)
          node "$tool/node_modules/@skaleagents/swarm/dist/index.js" scan --cves --fail-on high package-lock.json
